<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kedu - Learn & Succeed</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container">
    <nav>
      <div class="logo">Kedu</div>
      <div>
        <a href="about.html" class="btn btn-outline">About</a>
        <a href="contact.html" class="btn btn-outline">Contact</a>
        <button class="btn btn-primary" onclick="showModal('loginModal')">Login</button>
      </div>
    </nav>
  </div>
</header>

<main class="container" style="padding: 4rem 0; text-align:center;">
  <h1 style="font-size:3.2rem; margin-bottom:1rem;">Welcome to Kedu</h1>
  <p style="font-size:1.3rem; color:var(--text-muted); max-width:700px; margin:0 auto 2rem;">
    Sri Lanka's modern platform for O/L, A/L, Grade classes, seminars, past papers & study materials.
  </p>
  <button class="btn btn-primary" style="font-size:1.3rem; padding:1rem 2.5rem;" onclick="showModal('registerModal')">
    Get Started – Register Now
  </button>
</main>

<!-- Login Modal -->
<div id="loginModal" class="modal hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width:420px; max-width:90%;">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" required style="width:100%; padding:0.9rem; margin:0.8rem 0; border-radius:6px; border:1px solid var(--border); background:#0d1117; color:white;">
      <input type="password" id="loginPassword" placeholder="Password" required style="width:100%; padding:0.9rem; margin:0.8rem 0; border-radius:6px; border:1px solid var(--border); background:#0d1117; color:white;">
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Login</button>
    </form>
    <p style="margin-top:1.2rem; text-align:center;">
      Don't have an account? <a href="#" onclick="showModal('registerModal'); closeModal('loginModal')">Register</a>
    </p>
  </div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width:480px; max-width:95%;">
    <h2>Create Account</h2>
    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="Choose username" required style="width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:6px; border:1px solid var(--border); background:#0d1117; color:white;">
      <input type="password" id="regPassword" placeholder="Password" required style="width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:6px; border:1px solid var(--border); background:#0d1117; color:white;">
      
      <select id="regRole" required style="width:100%; padding:0.9rem; margin:0.8rem 0; border-radius:6px; background:#0d1117; color:white; border:1px solid var(--border);">
        <option value="">I am a...</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="staff">Staff</option>
      </select>

      <div id="studentFields" class="hidden">
        <select id="grade" style="width:100%; padding:0.9rem; margin:0.5rem 0;">
          <option value="">Grade / Level</option>
          <option value="1">Grade 1</option><option value="2">Grade 2</option><!-- ... --> <option value="13">Grade 13 / A/L</option>
          <option value="uni">University</option><option value="course">Other Course</option>
        </select>
        <select id="examLevel" style="width:100%; padding:0.9rem; margin:0.5rem 0;">
          <option value="">Exam Level</option>
          <option value="none">None</option>
          <option value="ol">O/L</option>
          <option value="al">A/L</option>
        </select>
        <select id="batch" style="width:100%; padding:0.9rem; margin:0.5rem 0;">
          <option value="">Batch / Year</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
        <select id="subjects" multiple style="width:100%; padding:0.9rem; height:120px; margin:0.5rem 0;">
          <option value="Mathematics">Mathematics</option>
          <option value="Science">Science</option>
          <option value="English">English</option>
          <option value="Sinhala">Sinhala</option>
          <option value="Tamil">Tamil</option>
          <option value="History">History</option>
          <option value="Buddhism">Buddhism</option>
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Biology">Biology</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.2rem;">Register</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
